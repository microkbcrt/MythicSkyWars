name: Nightly Build

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # JDK MATRIX
      # =========================
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Set up JDK 16
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 16

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # =========================
      # Install Spigot 26.2
      # =========================
      - name: Install Spigot 26.2 (BuildTools)
        run: |
          mkdir -p $RUNNER_TEMP/buildtools
          cd $RUNNER_TEMP/buildtools

          curl -L -o BuildTools.jar \
            https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar

          java -Xmx2G -jar BuildTools.jar --rev 26.2

      # =========================
      # Maven Toolchains (FULL FIX)
      # =========================
      - name: Configure Maven Toolchains
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/toolchains.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>

            <toolchain>
              <type>jdk</type>
              <provides><version>1.8</version></provides>
              <configuration>
                <jdkHome>${JAVA_HOME_8_X64}</jdkHome>
              </configuration>
            </toolchain>

            <toolchain>
              <type>jdk</type>
              <provides><version>16</version></provides>
              <configuration>
                <jdkHome>${JAVA_HOME_16_X64}</jdkHome>
              </configuration>
            </toolchain>

            <toolchain>
              <type>jdk</type>
              <provides><version>17</version></provides>
              <configuration>
                <jdkHome>${JAVA_HOME_17_X64}</jdkHome>
              </configuration>
            </toolchain>

            <toolchain>
              <type>jdk</type>
              <provides><version>21</version></provides>
              <configuration>
                <jdkHome>${JAVA_HOME_21_X64}</jdkHome>
              </configuration>
            </toolchain>

            <toolchain>
              <type>jdk</type>
              <provides><version>25</version></provides>
              <configuration>
                <jdkHome>${JAVA_HOME_25_X64}</jdkHome>
              </configuration>
            </toolchain>

          </toolchains>
          EOF

      # =========================
      # Versioning
      # =========================
      - name: Generate nightly version
        id: version
        run: |
          BASE_VERSION=$(grep -oP '(?<=<revision>)[^<]+' pom.xml | head -1)
          SHORT_SHA=$(git rev-parse --short HEAD)

          NIGHTLY_VERSION="${BASE_VERSION}-nightly.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
          echo "version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"

      # =========================
      # Build
      # =========================
      - name: Build
        run: |
          mvn clean package \
            -Drevision=${{ steps.version.outputs.version }} \
            -B --no-transfer-progress \
            -DskipTests

      # =========================
      # Locate JAR
      # =========================
      - name: Locate JAR
        id: jar
        run: |
          JAR=$(find . -type f -path "*/target/*.jar" \
            ! -name "*sources*" \
            ! -name "*javadoc*" \
            | head -n 1)

          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "Found jar: $JAR"

      # =========================
      # Upload Artifacts (MAIN OUTPUT)
      # =========================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MythicSkywars-Nightly-${{ github.run_number }}
          path: |
            ${{ steps.jar.outputs.jar }}
            **/target/*.jar
          retention-days: 14
