name: Nightly Build

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # JDK ONLY ONCE (FIXED)
      # =========================
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # =========================
      # Install Spigot via BuildTools (CRITICAL FIX)
      # =========================
      - name: Install Spigot 26.2 (BuildTools)
        run: |
          mkdir -p $RUNNER_TEMP/buildtools
          cd $RUNNER_TEMP/buildtools

          curl -L -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar

          java -Xmx2G -jar BuildTools.jar --rev 26.2

      # =========================
      # Toolchains FIXED
      # =========================
      - name: Configure Maven Toolchains
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
      
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>1.8</version>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME_8_X64}</jdkHome>
              </configuration>
            </toolchain>
      
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>25</version>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME_25_X64}</jdkHome>
              </configuration>
            </toolchain>
      
          </toolchains>
          EOF

      # =========================
      # Versioning
      # =========================
      - name: Generate nightly version
        id: version
        run: |
          BASE_VERSION=$(grep -oP '(?<=<revision>)[^<]+' pom.xml | head -1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          NIGHTLY_VERSION="${BASE_VERSION}-nightly.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
          NIGHTLY_TAG="nightly-${GITHUB_RUN_NUMBER}"

          echo "version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${NIGHTLY_TAG}" >> "$GITHUB_OUTPUT"

      # =========================
      # Build
      # =========================
      - name: Build
        run: |
          mvn clean package \
            -Drevision=${{ steps.version.outputs.version }} \
            -B --no-transfer-progress \
            -DskipTests

      # =========================
      # Detect JAR safely (FIXED)
      # =========================
      - name: Locate JAR
        id: jar
        run: |
          JAR=$(find target -maxdepth 1 -type f -name "*.jar" ! -name "*sources*" ! -name "*javadoc*" | head -n 1)
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "Found jar: $JAR"

      # =========================
      # GitHub Release
      # =========================
      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "MythicSkywars Nightly #${{ github.run_number }}"
          prerelease: true
          files: ${{ steps.jar.outputs.jar }}

      # =========================
      # Modrinth Upload (FIXED)
      # =========================
      - name: Upload nightly to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_KEY }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          JAR="${{ steps.jar.outputs.jar }}"
          VERSION="${{ steps.version.outputs.version }}"

          curl -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: MythicSkywars/${VERSION}" \
            -F "data={
              \"name\": \"Nightly ${VERSION}\",
              \"version_number\": \"${VERSION}\",
              \"version_type\": \"alpha\",
              \"loaders\": [\"spigot\",\"paper\",\"bukkit\"],
              \"game_versions\": [\"26.2\"],
              \"project_id\": \"${MODRINTH_PROJECT_ID}\",
              \"dependencies\": []
            }" \
            -F "file=@${JAR}" \
            --fail-with-body

      # =========================
      # Update Modrinth Description
      # =========================
      - name: Update Modrinth project description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_KEY }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          BODY_CONTENT=$(cat README.md)
          PAYLOAD=$(jq -n --arg body "$BODY_CONTENT" '{body:$body}')

          curl -X PATCH "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_ID}" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: MythicSkywars" \
            -d "$PAYLOAD" \
            --fail-with-body
